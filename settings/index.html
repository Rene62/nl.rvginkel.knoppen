<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <script type="text/javascript" src="/homey.js" data-origin="settings">
    </script>

    <style>
        * { box-sizing: border-box; }
        .button-toolbar {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 10px 0 12px;
            background: var(--homey-background-color, #fff);
        }
        .button-list { display: flex; flex-direction: column; gap: 6px; }
        .button-list-row {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 48px;
            padding: 8px 10px;
            border: 1px solid var(--homey-color-mono-100, #ddd);
            border-radius: 9px;
        }
        .button-number { width: 32px; flex: 0 0 32px; text-align: right; opacity: .7; }
        .button-list-text { min-width: 0; flex: 1; overflow-wrap: anywhere; }
        .button-icon-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 8px;
            color: var(--homey-text-color, inherit);
            background: transparent;
            cursor: pointer;
        }
        .button-icon-action:hover { background: var(--homey-color-mono-050, rgba(127,127,127,.15)); }
        .button-icon-action:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
        .button-icon-action:disabled { opacity: .4; cursor: default; }
        .button-icon-action svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .editor-header { margin-bottom: 18px; }
        .editor-actions { display: flex; gap: 10px; margin-top: 18px; }
        .editor-actions button { flex: 1; min-width: 0; }
        [hidden] { display: none !important; }
    </style>

</head>

<body>

    <header class="homey-header">
        <h1 class="homey-title" data-i18n="settings.title">
        </h1>

        <p class="homey-subtitle" data-i18n="settings.subtitle">
        </p>
    </header>



    <section id="listView">
        <div class="button-toolbar">
            <button id="addButton" type="button" class="homey-button-primary-full" data-i18n="settings.new_button"></button>
        </div>
        <div id="buttonList" class="button-list" data-i18n="settings.loading_buttons"></div>
    </section>

    <section id="editorView" hidden>
        <h2 id="editorTitle" class="homey-title editor-header"></h2>
        <div id="editorContent"></div>
    </section>

    <script>


        function onHomeyReady(Homey) {

            const buttonList =
                document.getElementById('buttonList');

            const addButton =
                document.getElementById('addButton');
            const listView = document.getElementById('listView');
            const editorView = document.getElementById('editorView');
            const editorContent = document.getElementById('editorContent');
            const editorTitle = document.getElementById('editorTitle');
            const iconMarkup = {
                edit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4Z"/></svg>',
                delete: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6M10 10v7m4-7v7"/></svg>'
            };

            function closeEditor() {
                editorContent.replaceChildren();
                editorView.hidden = true;
                listView.hidden = false;
            }

            function openEditor(button) {
                editorContent.replaceChildren();
                listView.hidden = true;
                editorView.hidden = false;
                editorTitle.textContent = button
                    ? Homey.__('settings.edit_button_title', { number: button.number })
                    : Homey.__('settings.add_button_title');
                createButtonEditor(button);
                window.scrollTo(0, 0);
            }

            function makeIconButton(kind, label) {
                const element = document.createElement('button');
                element.type = 'button';
                element.className = 'button-icon-action';
                element.innerHTML = iconMarkup[kind];
                element.setAttribute('aria-label', label);
                element.title = label;
                return element;
            }

            function renderButtonList(buttons) {
                buttonList.replaceChildren();
                if (!Array.isArray(buttons) || !buttons.length) {
                    buttonList.textContent = Homey.__('settings.no_buttons');
                    return;
                }
                buttons.slice().sort((a, b) => a.number - b.number).forEach(button => {
                    const row = document.createElement('div');
                    row.className = 'button-list-row';
                    const number = document.createElement('span');
                    number.className = 'button-number';
                    number.textContent = String(button.number);
                    const text = document.createElement('span');
                    text.className = 'button-list-text';
                    text.textContent = button.text || Homey.__('settings.button_fallback');
                    const edit = makeIconButton('edit', Homey.__('settings.edit'));
                    edit.addEventListener('click', () => openEditor(button));
                    const remove = makeIconButton('delete', Homey.__('settings.delete'));
                    remove.addEventListener('click', async () => {
                        const confirmed = await Homey.confirm(Homey.__('settings.delete_confirm', {
                            name: button.text || Homey.__('settings.button_fallback')
                        }));
                        if (!confirmed) return;
                        remove.disabled = true;
                        Homey.api('DELETE', `/buttons?id=${encodeURIComponent(button.id)}`, null, error => {
                            if (error) {
                                remove.disabled = false;
                                Homey.alert(Homey.__('settings.delete_error', { error: error.message || error }));
                                return;
                            }
                            loadButtons();
                        });
                    });
                    row.append(number, text, edit, remove);
                    buttonList.appendChild(row);
                });
            }

            let booleanVariables = [];
            let betterLogicBooleanVariables = [];
            let betterLogicAvailable = false;

            /*
             * Alle knoppen laden
             */
            function loadButtons() {

                /*
                 * Eerst controleren of Better Logic beschikbaar is
                 */
                Homey.api(
                    'GET',
                    '/betterlogic-available',
                    null,
                    function (error, available) {

                        if (error) {

                            console.error(
                                'Fout bij controleren Better Logic:',
                                error
                            );

                            betterLogicAvailable = false;

                        } else {

                            betterLogicAvailable =
                                available === true;
                        }


                        /*
                         * Daarna Homey Logic Ja/Nee-variabelen laden
                         */
                        Homey.api(
                            'GET',
                            '/boolean-variables',
                            null,
                            function (error, variables) {

                                if (error) {

                                    console.error(
                                        'Fout bij ophalen Ja/Nee-variabelen:',
                                        error
                                    );

                                    buttonList.textContent =
                                        Homey.__(
                                            'settings.load_boolean_variables_error'
                                        );

                                    return;
                                }

                                booleanVariables =
                                    Array.isArray(variables)
                                        ? variables
                                        : [];


                                /*
                                 * Als Better Logic beschikbaar is,
                                 * eerst de Better Logic Ja/Nee-variabelen laden.
                                 */
                                if (betterLogicAvailable) {

                                    Homey.api(
                                        'GET',
                                        '/betterlogic-boolean-variables',
                                        null,
                                        function (error, variables) {

                                            if (error) {

                                                console.error(
                                                    'Fout bij ophalen Better Logic Ja/Nee-variabelen:',
                                                    error
                                                );

                                                betterLogicBooleanVariables = [];

                                            } else {

                                                betterLogicBooleanVariables =
                                                    Array.isArray(variables)
                                                        ? variables
                                                        : [];
                                            }

                                            loadStoredButtons();
                                        }
                                    );

                                } else {

                                    betterLogicBooleanVariables = [];
                                    loadStoredButtons();
                                }
                            }
                        );
                    }
                );
                function loadStoredButtons() {

                    Homey.api(
                        'GET',
                        '/buttons',
                        null,
                        function (error, buttons) {

                            if (error) {

                                console.error(error);

                                buttonList.textContent =
                                    Homey.__(
                                        'settings.load_buttons_error'
                                    );

                                return;
                            }

                            renderButtonList(buttons);
                        }
                    );
                }
            }


            /*
             * Editor voor één knop maken
             */
            function createButtonEditor(button) {
                const isNew = !button;
                button = button || {
                    type: 'action',
                    text: Homey.__('settings.new_button_default'),
                    width: 'small',
                    shape: 'pill',
                    textAlign: 'center',
                    actionValue: '',
                    variableSource: 'homey',
                    variableId: null
                };

                const fieldset = document.createElement('fieldset');
                fieldset.className = 'homey-form-fieldset';

                /*
                 * TYPE
                 */
                const typeGroup =
                    document.createElement('div');

                typeGroup.className =
                    'homey-form-group';

                typeGroup.innerHTML = `
    <label class="homey-form-label">
        ${Homey.__('settings.type')}
    </label>

    <select class="homey-form-select type-input">
        <option value="action">
            ${Homey.__('settings.type_action')}
        </option>

        <option value="boolean">
            ${Homey.__('settings.type_boolean')}
        </option>
    </select>
`;

                const typeInput =
                    typeGroup.querySelector('.type-input');

                typeInput.value =
                    button.type || 'action';

                fieldset.appendChild(typeGroup);


                /*
                 * TEKST
                 */
                const textGroup =
                    document.createElement('div');

                textGroup.className =
                    'homey-form-group';

                textGroup.innerHTML = `
    <label class="homey-form-label">
        ${Homey.__('settings.text')}
    </label>

    <input
        class="homey-form-input text-input"
        type="text">
`;

                const textInput =
                    textGroup.querySelector('.text-input');

                textInput.value =
                    button.text || '';

                fieldset.appendChild(textGroup);


                /*
                 * BREEDTE
                 */
                const widthGroup =
                    document.createElement('div');

                widthGroup.className =
                    'homey-form-group';


                widthGroup.innerHTML = `
    <label class="homey-form-label">
        ${Homey.__('settings.width')}
    </label>

    <select class="homey-form-select width-input">

        <option value="small">
            ${Homey.__('settings.width_small')}
        </option>

        <option value="large">
            ${Homey.__('settings.width_large')}
        </option>

    </select>
`;
                const widthInput =
                    widthGroup.querySelector('.width-input');

                widthInput.value =
                    button.width || 'small';

                fieldset.appendChild(widthGroup);

                // Knopvorm: geldt voor zowel actie- als Ja/Nee-knoppen.
                const shapeGroup = document.createElement('div');
                shapeGroup.className = 'homey-form-group';
                shapeGroup.innerHTML = `
    <label class="homey-form-label">${Homey.__('settings.button_shape')}</label>
    <select class="homey-form-select shape-input">
        <option value="pill">${Homey.__('settings.button_shape_pill')}</option>
        <option value="rounded">${Homey.__('settings.button_shape_rounded')}</option>
    </select>
`;
                const shapeInput = shapeGroup.querySelector('.shape-input');
                shapeInput.value = button.shape || 'pill';
                fieldset.appendChild(shapeGroup);

                /*
  * TEKSTUITLIJNING
  */
                const textAlignGroup =
                    document.createElement('div');

                textAlignGroup.className =
                    'homey-form-group';

                textAlignGroup.innerHTML = `
    <label class="homey-form-label">
        ${Homey.__('settings.text_alignment')}
    </label>

    <select class="homey-form-select text-align-input">
        <option value="left">
            ${Homey.__('settings.text_alignment_left')}
        </option>

        <option value="center">
            ${Homey.__('settings.text_alignment_center')}
        </option>
    </select>
`;

                const textAlignInput =
                    textAlignGroup.querySelector(
                        '.text-align-input'
                    );

                textAlignInput.value =
                    button.textAlign || 'center';

                fieldset.appendChild(textAlignGroup);


                /*
                 * ACTIEWAARDE
                 */
                const actionValueGroup =
                    document.createElement('div');

                actionValueGroup.className =
                    'homey-form-group';

                actionValueGroup.innerHTML = `
    <label class="homey-form-label">
        ${Homey.__('settings.action_value')}
    </label>

    <input
        class="homey-form-input action-value-input"
        type="text">
`;

                const actionValueInput =
                    actionValueGroup.querySelector(
                        '.action-value-input'
                    );

                actionValueInput.value =
                    button.actionValue || '';

                fieldset.appendChild(actionValueGroup);

                /*
 * STATUSBRON
 */
                const variableSourceGroup =
                    document.createElement('div');

                variableSourceGroup.className =
                    'homey-form-group';

                variableSourceGroup.innerHTML = `
    <label class="homey-form-label">
        ${Homey.__('settings.status_source')}
    </label>

    <select class="homey-form-select variable-source-input">
        <option value="homey">
            ${Homey.__('settings.status_source_homey')}
        </option>

        <option value="flow">
            ${Homey.__('settings.status_source_flow')}
        </option>
    </select>
`;

                const variableSourceInput =
                    variableSourceGroup.querySelector(
                        '.variable-source-input'
                    );

                if (betterLogicAvailable) {

                    const betterLogicOption =
                        document.createElement('option');

                    betterLogicOption.value =
                        'betterlogic';

                    betterLogicOption.textContent =
                        Homey.__(
                            'settings.status_source_betterlogic'
                        );

                    variableSourceInput.insertBefore(
                        betterLogicOption,
                        variableSourceInput.querySelector(
                            'option[value="flow"]'
                        )
                    );
                }

                variableSourceInput.value =
                    button.variableSource || 'homey';

                fieldset.appendChild(variableSourceGroup);

                /*
                 * JA/NEE-VARIABELE
                 */
                const booleanVariableGroup =
                    document.createElement('div');

                booleanVariableGroup.className =
                    'homey-form-group';

                booleanVariableGroup.innerHTML = `
    <label class="homey-form-label">
        ${Homey.__('settings.boolean_variable')}
    </label>

    <select
        class="homey-form-select boolean-variable-input">

        <option value="">
            ${Homey.__('settings.select_variable')}
        </option>

    </select>
`;

                const booleanVariableInput =
                    booleanVariableGroup.querySelector(
                        '.boolean-variable-input'
                    );

                fieldset.appendChild(booleanVariableGroup);

                /*
                 * Ja/Nee-variabelen in dropdown zetten
                 */
                function updateBooleanVariableOptions() {

                    booleanVariableInput.innerHTML = '';

                    const emptyOption =
                        document.createElement('option');

                    emptyOption.value = '';
                    emptyOption.textContent =
                        Homey.__('settings.select_variable');

                    booleanVariableInput.appendChild(emptyOption);


                    let variables = [];

                    if (variableSourceInput.value === 'homey') {

                        variables = booleanVariables;

                    } else if (
                        variableSourceInput.value === 'betterlogic'
                    ) {

                        variables = betterLogicBooleanVariables;
                    }


                    variables.forEach(variable => {

                        const option =
                            document.createElement('option');

                        option.value =
                            variable.id;

                        option.textContent =
                            variable.name;

                        booleanVariableInput.appendChild(option);
                    });


                    /*
                     * Bestaande koppeling selecteren
                     */
                    if (
                        button.variableSource === variableSourceInput.value &&
                        button.variableId
                    ) {
                        booleanVariableInput.value =
                            button.variableId;
                    }
                }

                updateBooleanVariableOptions();

                function updateTypeFields() {

                    if (typeInput.value === 'boolean') {

                        actionValueGroup.style.display = 'none';
                        textAlignGroup.style.display = '';
                        variableSourceGroup.style.display = '';

                        if (variableSourceInput.value === 'flow') {
                            booleanVariableGroup.style.display = 'none';
                        } else {
                            booleanVariableGroup.style.display = '';
                        }

                    } else {

                        actionValueGroup.style.display = '';
                        textAlignGroup.style.display = 'none';
                        variableSourceGroup.style.display = 'none';
                        booleanVariableGroup.style.display = 'none';
                    }
                }


                typeInput.addEventListener(
                    'change',
                    updateTypeFields
                );
                variableSourceInput.addEventListener(
                    'change',
                    function () {

                        updateBooleanVariableOptions();
                        updateTypeFields();
                    }
                );


                // Meteen juiste velden tonen
                updateTypeFields();


                /*
                 * OPSLAAN
                 */
                const saveButton =
                    document.createElement('button');

                saveButton.className = 'homey-button-primary';
                saveButton.type = 'button';

                saveButton.textContent =
                    Homey.__('settings.save');

                let changes = false;
                function markAsChanged(event) {

                    if (
                        event.target.matches(
                            'input, select, textarea'
                        )
                    ) {
                        changes = true;
                        saveButton.textContent =
                            Homey.__('settings.save_changed');
                    }
                }


                fieldset.addEventListener(
                    'input',
                    markAsChanged
                );

                fieldset.addEventListener(
                    'change',
                    markAsChanged
                );


                saveButton.addEventListener(
                    'click',
                    function () {

                        saveButton.disabled = true;

                        Homey.api(
                            isNew ? 'POST' : 'PUT',
                            '/buttons',
                            {
                                ...(isNew ? {} : { id: button.id }),

                                type:
                                    typeInput.value,

                                text:
                                    textInput.value,

                                width:
                                    widthInput.value,

                                shape:
                                    shapeInput.value,

                                textAlign:
                                    typeInput.value === 'boolean'
                                        ? textAlignInput.value
                                        : 'center',

                                actionValue:
                                    typeInput.value === 'action'
                                        ? actionValueInput.value
                                        : '',

                                variableSource:
                                    typeInput.value === 'boolean'
                                        ? variableSourceInput.value
                                        : 'homey',

                                variableId:
                                    typeInput.value === 'boolean'
                                        ? booleanVariableInput.value || null
                                        : null,

                                variableName:
                                    typeInput.value === 'boolean'
                                        && booleanVariableInput.selectedIndex > 0
                                        ? booleanVariableInput.options[
                                            booleanVariableInput.selectedIndex
                                        ].textContent
                                        : null
                            },

                            function (error, updatedButton) {

                                saveButton.disabled = false;

                                if (error) {

                                    console.error(
                                        'Fout bij opslaan knop:',
                                        error
                                    );

                                    Homey.alert(
                                        Homey.__('settings.save_error')
                                    );

                                    return;
                                }

                                closeEditor();
                                loadButtons();
                            }
                        );
                    }
                );


                const cancelButton = document.createElement('button');
                cancelButton.type = 'button';
                cancelButton.className = 'homey-button-secondary';
                cancelButton.textContent = Homey.__('settings.cancel');
                cancelButton.addEventListener('click', closeEditor);

                const actions = document.createElement('div');
                actions.className = 'editor-actions';
                actions.append(cancelButton, saveButton);
                fieldset.appendChild(actions);
                editorContent.appendChild(fieldset);
            }

            addButton.addEventListener('click', () => openEditor(null));


            /*
             * Eerste keer laden
             */
            loadButtons();

            Homey.ready();
        }

    </script>
</body>

</html>
