<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <script type="text/javascript" src="/homey.js" data-origin="settings">
    </script>

    <style>
        .button-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            box-sizing: border-box;
        }

        .button-delete {
            margin-left: 16px;
        }
    </style>

</head>

<body>

    <header class="homey-header">
        <h1 class="homey-title" data-i18n="settings.title">
        </h1>

        <p class="homey-subtitle" data-i18n="settings.subtitle">
        </p>
    </header>



    <div id="buttonList" data-i18n="settings.loading_buttons">
    </div>

    <div class="homey-form-group">
        <button id="addButton" class="homey-button-primary-full" data-i18n="settings.new_button">
        </button>
    </div>

    <script>


        function onHomeyReady(Homey) {

            const buttonList =
                document.getElementById('buttonList');

            const addButton =
                document.getElementById('addButton');

            let booleanVariables = [];
            let betterLogicBooleanVariables = [];
            let betterLogicAvailable = false;

            /*
             * Alle knoppen laden
             */
            function loadButtons() {

                /*
                 * Eerst controleren of Better Logic beschikbaar is
                 */
                Homey.api(
                    'GET',
                    '/betterlogic-available',
                    null,
                    function (error, available) {

                        if (error) {

                            console.error(
                                'Fout bij controleren Better Logic:',
                                error
                            );

                            betterLogicAvailable = false;

                        } else {

                            betterLogicAvailable =
                                available === true;
                        }


                        /*
                         * Daarna Homey Logic Ja/Nee-variabelen laden
                         */
                        Homey.api(
                            'GET',
                            '/boolean-variables',
                            null,
                            function (error, variables) {

                                if (error) {

                                    console.error(
                                        'Fout bij ophalen Ja/Nee-variabelen:',
                                        error
                                    );

                                    buttonList.textContent =
                                        Homey.__(
                                            'settings.load_boolean_variables_error'
                                        );

                                    return;
                                }

                                booleanVariables =
                                    Array.isArray(variables)
                                        ? variables
                                        : [];


                                /*
                                 * Als Better Logic beschikbaar is,
                                 * eerst de Better Logic Ja/Nee-variabelen laden.
                                 */
                                if (betterLogicAvailable) {

                                    Homey.api(
                                        'GET',
                                        '/betterlogic-boolean-variables',
                                        null,
                                        function (error, variables) {

                                            if (error) {

                                                console.error(
                                                    'Fout bij ophalen Better Logic Ja/Nee-variabelen:',
                                                    error
                                                );

                                                betterLogicBooleanVariables = [];

                                            } else {

                                                betterLogicBooleanVariables =
                                                    Array.isArray(variables)
                                                        ? variables
                                                        : [];
                                            }

                                            loadStoredButtons();
                                        }
                                    );

                                } else {

                                    betterLogicBooleanVariables = [];
                                    loadStoredButtons();
                                }
                            }
                        );
                    }
                );
                function loadStoredButtons() {

                    Homey.api(
                        'GET',
                        '/buttons',
                        null,
                        function (error, buttons) {

                            if (error) {

                                console.error(error);

                                buttonList.textContent =
                                    Homey.__(
                                        'settings.load_buttons_error'
                                    );

                                return;
                            }

                            if (
                                !Array.isArray(buttons) ||
                                buttons.length === 0
                            ) {

                                buttonList.textContent =
                                    Homey.__(
                                        'settings.no_buttons'
                                    );

                                return;
                            }

                            buttonList.innerHTML = '';

                            buttons.forEach(button => {
                                createButtonEditor(button);
                            });
                        }
                    );
                }
            }


            /*
             * Editor voor één knop maken
             */
            function createButtonEditor(button) {

                const fieldset =
                    document.createElement('fieldset');

                fieldset.className =
                    'homey-form-fieldset';


                /*
                 * Titel
                 */
                const titleRow =
                    document.createElement('div');

                titleRow.className =
                    'button-title-row';


                const legendText =
                    document.createElement('span');

                legendText.className =
                    'homey-form-legend';

                legendText.textContent =
                    Homey.__(
                        'settings.button_name',
                        {
                            number: button.number,
                            text:
                                button.text ||
                                Homey.__('settings.button_fallback')
                        }
                    );


                const deleteButton =
                    document.createElement('button');

                deleteButton.type = 'button';
                deleteButton.textContent =
                    Homey.__('settings.delete');
                deleteButton.className = 'button-delete';

                deleteButton.addEventListener(
                    'click',
                    async function () {

                        const confirmed = await Homey.confirm(
                            Homey.__(
                                'settings.delete_confirm',
                                {
                                    name:
                                        button.text ||
                                        Homey.__('settings.button_fallback')
                                }
                            )
                        );

                        if (!confirmed) {
                            return;
                        }

                        deleteButton.disabled = true;

                        Homey.api(
                            'DELETE',
                            `/buttons?id=${encodeURIComponent(button.id)}`,
                            null,
                            function (error) {

                                if (error) {
                                    deleteButton.disabled = false;

                                    console.error(
                                        'Fout bij verwijderen knop:',
                                        error
                                    );

                                    Homey.alert(
                                        Homey.__(
                                            'settings.delete_error',
                                            {
                                                error: error.message || error
                                            }
                                        )
                                    );

                                    return;
                                }

                                fieldset.remove();
                            }
                        );
                    }
                );

                titleRow.appendChild(legendText);
                titleRow.appendChild(deleteButton);

                fieldset.appendChild(titleRow);


                /*
                 * TYPE
                 */
                const typeGroup =
                    document.createElement('div');

                typeGroup.className =
                    'homey-form-group';

                typeGroup.innerHTML = `
    <label class="homey-form-label">
        ${Homey.__('settings.type')}
    </label>

    <select class="homey-form-select type-input">
        <option value="action">
            ${Homey.__('settings.type_action')}
        </option>

        <option value="boolean">
            ${Homey.__('settings.type_boolean')}
        </option>
    </select>
`;

                const typeInput =
                    typeGroup.querySelector('.type-input');

                typeInput.value =
                    button.type || 'action';

                fieldset.appendChild(typeGroup);


                /*
                 * TEKST
                 */
                const textGroup =
                    document.createElement('div');

                textGroup.className =
                    'homey-form-group';

                textGroup.innerHTML = `
    <label class="homey-form-label">
        ${Homey.__('settings.text')}
    </label>

    <input
        class="homey-form-input text-input"
        type="text">
`;

                const textInput =
                    textGroup.querySelector('.text-input');

                textInput.value =
                    button.text || '';

                fieldset.appendChild(textGroup);


                /*
                 * BREEDTE
                 */
                const widthGroup =
                    document.createElement('div');

                widthGroup.className =
                    'homey-form-group';


                widthGroup.innerHTML = `
    <label class="homey-form-label">
        ${Homey.__('settings.width')}
    </label>

    <select class="homey-form-select width-input">

        <option value="small">
            ${Homey.__('settings.width_small')}
        </option>

        <option value="large">
            ${Homey.__('settings.width_large')}
        </option>

    </select>
`;
                const widthInput =
                    widthGroup.querySelector('.width-input');

                widthInput.value =
                    button.width || 'small';

                fieldset.appendChild(widthGroup);

                /*
  * TEKSTUITLIJNING
  */
                const textAlignGroup =
                    document.createElement('div');

                textAlignGroup.className =
                    'homey-form-group';

                textAlignGroup.innerHTML = `
    <label class="homey-form-label">
        ${Homey.__('settings.text_alignment')}
    </label>

    <select class="homey-form-select text-align-input">
        <option value="left">
            ${Homey.__('settings.text_alignment_left')}
        </option>

        <option value="center">
            ${Homey.__('settings.text_alignment_center')}
        </option>
    </select>
`;

                const textAlignInput =
                    textAlignGroup.querySelector(
                        '.text-align-input'
                    );

                textAlignInput.value =
                    button.textAlign || 'center';

                fieldset.appendChild(textAlignGroup);


                /*
                 * ACTIEWAARDE
                 */
                const actionValueGroup =
                    document.createElement('div');

                actionValueGroup.className =
                    'homey-form-group';

                actionValueGroup.innerHTML = `
    <label class="homey-form-label">
        ${Homey.__('settings.action_value')}
    </label>

    <input
        class="homey-form-input action-value-input"
        type="text">
`;

                const actionValueInput =
                    actionValueGroup.querySelector(
                        '.action-value-input'
                    );

                actionValueInput.value =
                    button.actionValue || '';

                fieldset.appendChild(actionValueGroup);

                /*
 * STATUSBRON
 */
                const variableSourceGroup =
                    document.createElement('div');

                variableSourceGroup.className =
                    'homey-form-group';

                variableSourceGroup.innerHTML = `
    <label class="homey-form-label">
        ${Homey.__('settings.status_source')}
    </label>

    <select class="homey-form-select variable-source-input">
        <option value="homey">
            ${Homey.__('settings.status_source_homey')}
        </option>

        <option value="flow">
            ${Homey.__('settings.status_source_flow')}
        </option>
    </select>
`;

                const variableSourceInput =
                    variableSourceGroup.querySelector(
                        '.variable-source-input'
                    );

                if (betterLogicAvailable) {

                    const betterLogicOption =
                        document.createElement('option');

                    betterLogicOption.value =
                        'betterlogic';

                    betterLogicOption.textContent =
                        Homey.__(
                            'settings.status_source_betterlogic'
                        );

                    variableSourceInput.insertBefore(
                        betterLogicOption,
                        variableSourceInput.querySelector(
                            'option[value="flow"]'
                        )
                    );
                }

                variableSourceInput.value =
                    button.variableSource || 'homey';

                fieldset.appendChild(variableSourceGroup);

                /*
                 * JA/NEE-VARIABELE
                 */
                const booleanVariableGroup =
                    document.createElement('div');

                booleanVariableGroup.className =
                    'homey-form-group';

                booleanVariableGroup.innerHTML = `
    <label class="homey-form-label">
        ${Homey.__('settings.boolean_variable')}
    </label>

    <select
        class="homey-form-select boolean-variable-input">

        <option value="">
            ${Homey.__('settings.select_variable')}
        </option>

    </select>
`;

                const booleanVariableInput =
                    booleanVariableGroup.querySelector(
                        '.boolean-variable-input'
                    );

                fieldset.appendChild(booleanVariableGroup);

                /*
                 * Ja/Nee-variabelen in dropdown zetten
                 */
                function updateBooleanVariableOptions() {

                    booleanVariableInput.innerHTML = '';

                    const emptyOption =
                        document.createElement('option');

                    emptyOption.value = '';
                    emptyOption.textContent =
                        Homey.__('settings.select_variable');

                    booleanVariableInput.appendChild(emptyOption);


                    let variables = [];

                    if (variableSourceInput.value === 'homey') {

                        variables = booleanVariables;

                    } else if (
                        variableSourceInput.value === 'betterlogic'
                    ) {

                        variables = betterLogicBooleanVariables;
                    }


                    variables.forEach(variable => {

                        const option =
                            document.createElement('option');

                        option.value =
                            variable.id;

                        option.textContent =
                            variable.name;

                        booleanVariableInput.appendChild(option);
                    });


                    /*
                     * Bestaande koppeling selecteren
                     */
                    if (
                        button.variableSource === variableSourceInput.value &&
                        button.variableId
                    ) {
                        booleanVariableInput.value =
                            button.variableId;
                    }
                }

                updateBooleanVariableOptions();

                function updateTypeFields() {

                    if (typeInput.value === 'boolean') {

                        actionValueGroup.style.display = 'none';
                        textAlignGroup.style.display = '';
                        variableSourceGroup.style.display = '';

                        if (variableSourceInput.value === 'flow') {
                            booleanVariableGroup.style.display = 'none';
                        } else {
                            booleanVariableGroup.style.display = '';
                        }

                    } else {

                        actionValueGroup.style.display = '';
                        textAlignGroup.style.display = 'none';
                        variableSourceGroup.style.display = 'none';
                        booleanVariableGroup.style.display = 'none';
                    }
                }


                typeInput.addEventListener(
                    'change',
                    updateTypeFields
                );
                variableSourceInput.addEventListener(
                    'change',
                    function () {

                        updateBooleanVariableOptions();
                        updateTypeFields();
                    }
                );


                // Meteen juiste velden tonen
                updateTypeFields();


                /*
                 * OPSLAAN
                 */
                const saveButton =
                    document.createElement('button');

                saveButton.className =
                    'homey-button-primary-full';

                saveButton.textContent =
                    Homey.__('settings.save');

                let changes = false;
                function markAsChanged(event) {

                    if (
                        event.target.matches(
                            'input, select, textarea'
                        )
                    ) {
                        changes = true;
                        saveButton.textContent =
                            Homey.__('settings.save_changed');
                    }
                }


                fieldset.addEventListener(
                    'input',
                    markAsChanged
                );

                fieldset.addEventListener(
                    'change',
                    markAsChanged
                );


                saveButton.addEventListener(
                    'click',
                    function () {

                        saveButton.disabled = true;

                        Homey.api(
                            'PUT',
                            '/buttons',
                            {
                                id: button.id,

                                type:
                                    typeInput.value,

                                text:
                                    textInput.value,

                                width:
                                    widthInput.value,

                                textAlign:
                                    typeInput.value === 'boolean'
                                        ? textAlignInput.value
                                        : 'center',

                                actionValue:
                                    typeInput.value === 'action'
                                        ? actionValueInput.value
                                        : '',

                                variableSource:
                                    typeInput.value === 'boolean'
                                        ? variableSourceInput.value
                                        : 'homey',

                                variableId:
                                    typeInput.value === 'boolean'
                                        ? booleanVariableInput.value || null
                                        : null,

                                variableName:
                                    typeInput.value === 'boolean'
                                        && booleanVariableInput.selectedIndex > 0
                                        ? booleanVariableInput.options[
                                            booleanVariableInput.selectedIndex
                                        ].textContent
                                        : null
                            },

                            function (error, updatedButton) {

                                saveButton.disabled = false;

                                if (error) {

                                    console.error(
                                        'Fout bij opslaan knop:',
                                        error
                                    );

                                    Homey.alert(
                                        Homey.__('settings.save_error')
                                    );

                                    return;
                                }

                                changes = false;
                                saveButton.textContent =
                                    Homey.__('settings.save');

                                legendText.textContent =
                                    Homey.__(
                                        'settings.button_name',
                                        {
                                            number: updatedButton.number,
                                            text:
                                                updatedButton.text ||
                                                Homey.__('settings.button_fallback')
                                        }
                                    );
                                /*
                                 * Opnieuw laden zodat we
                                 * daadwerkelijk de opgeslagen
                                 * waarden tonen.
                                 */
                                Homey.alert(
                                    Homey.__('settings.save_success')
                                );


                            }
                        );
                    }
                );


                fieldset.appendChild(saveButton);

                buttonList.appendChild(fieldset);
            }


            /*
             * NIEUWE KNOP
             */
            addButton.addEventListener(
                'click',
                function () {

                    addButton.disabled = true;

                    Homey.api(
                        'POST',
                        '/buttons',
                        {
                            type: 'action',
                            text: Homey.__(
                                'settings.new_button_default'
                            ),
                            width: 'small',
                            actionValue: ''
                        },

                        function (error, button) {

                            addButton.disabled = false;

                            if (error) {

                                console.error(
                                    'Fout bij aanmaken knop:',
                                    error
                                );

                                Homey.alert(
                                    Homey.__('settings.create_error')
                                );

                                return;
                            }


                            createButtonEditor(button);
                        }
                    );
                }
            );


            /*
             * Eerste keer laden
             */
            loadButtons();

            Homey.ready();
        }

    </script>
</body>

</html>
