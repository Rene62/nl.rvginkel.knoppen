<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./index.css">
</head>

<body>

    <div id="buttonContainer"></div>

    <script>
        async function onHomeyReady(Homey) {

            const buttonContainer =
                document.getElementById('buttonContainer');


            Homey.on(
                'buttonPermanentColorChanged',
                data => {

                    const buttonElement =
                        buttonContainer.querySelector(
                            `[data-button-id="${data.buttonId}"]`
                        );

                    if (!buttonElement) {
                        return;
                    }

                    const permanentPath =
                        buttonElement.querySelector(
                            '.permanent-path'
                        );

                    if (!permanentPath) {
                        return;
                    }

                    permanentPath.style.stroke =
                        data.color || '#00ff66';

                    permanentPath.dataset.enabled =
                        data.enabled === true
                            ? 'true'
                            : 'false';

                    if (
                        buttonElement.dataset.lightloopActive ===
                        'true'
                    ) {
                        permanentPath.style.display =
                            'none';
                    } else {
                        permanentPath.style.display =
                            data.enabled === true
                                ? ''
                                : 'none';
                    }
                }
            );


            Homey.on(
                'buttonLightloop',
                data => {

                    const buttonElement =
                        buttonContainer.querySelector(
                            `[data-button-id="${data.buttonId}"]`
                        );

                    if (!buttonElement) {
                        return;
                    }

                    const permanentPath =
                        buttonElement.querySelector(
                            '.permanent-path'
                        );

                    if (permanentPath) {
                        permanentPath.style.display =
                            'none';
                    }

                    buttonElement.dataset.lightloopActive =
                        'true';

                    buttonElement.style.setProperty(
                        '--lightloop-color',
                        data.color
                    );

                    const lightloopPathTop =
                        buttonElement.querySelector(
                            '.lightloop-path-top'
                        );

                    const lightloopPathBottom =
                        buttonElement.querySelector(
                            '.lightloop-path-bottom'
                        );

                    if (
                        !lightloopPathTop ||
                        !lightloopPathBottom
                    ) {
                        return;
                    }

                    const lightloopPaths = [
                        lightloopPathTop,
                        lightloopPathBottom
                    ];

                    const totalLength =
                        lightloopPathTop.getTotalLength();

                    if (!totalLength) {
                        return;
                    }

                    const lineLength =
                        totalLength * 0.25;

                    const gapLength =
                        totalLength - lineLength;

                    lightloopPaths.forEach(
                        lightloopPath => {

                            lightloopPath.setAttribute(
                                'stroke-dasharray',
                                `${lineLength} ${gapLength}`
                            );
                        }
                    );

                    const pixelsPerSecond = 140;

                    const totalDuration =
                        data.duration * 1000;

                    const startTime =
                        performance.now();

                    lightloopPaths.forEach(
                        lightloopPath => {
                            lightloopPath.style.display = '';
                        }
                    );

                    function animateLightloop(now) {

                        const elapsed =
                            now - startTime;

                        if (elapsed >= totalDuration) {

                            lightloopPaths.forEach(
                                lightloopPath => {
                                    lightloopPath.style.display =
                                        'none';
                                }
                            );

                            buttonElement.dataset.lightloopActive =
                                'false';

                            if (permanentPath) {
                                permanentPath.style.display =
                                    permanentPath.dataset.enabled === 'true'
                                        ? ''
                                        : 'none';
                            }

                            return;
                        }

                        const travelled =
                            (elapsed / 1000) *
                            pixelsPerSecond;

                        const offset =
                            -(travelled % totalLength);

                        const secondLineOffset =
                            totalLength * 0.5;

                        lightloopPathTop.setAttribute(
                            'stroke-dashoffset',
                            offset
                        );

                        lightloopPathBottom.setAttribute(
                            'stroke-dashoffset',
                            offset - secondLineOffset
                        );

                        requestAnimationFrame(
                            animateLightloop
                        );
                    }

                    requestAnimationFrame(
                        animateLightloop
                    );
                }
            );

            Homey.on(
                'buttonEnabledChanged',
                data => {

                    const buttonElement =
                        buttonContainer.querySelector(
                            `[data-button-id="${data.buttonId}"]`
                        );

                    if (!buttonElement) {
                        return;
                    }

                    buttonElement.disabled =
                        data.enabled === false;

                    buttonElement.classList.toggle(
                        'button-disabled',
                        data.enabled === false
                    );
                }
            );

            Homey.on(

                'booleanVariableChanged',
                data => {

                    const booleanButtons =
                        buttonContainer.querySelectorAll(
                            '[data-variable-id]'
                        );

                    booleanButtons.forEach(
                        buttonElement => {

                            if (
                                buttonElement.dataset.variableSource !==
                                data.variableSource ||
                                buttonElement.dataset.variableId !==
                                data.variableId
                            ) {
                                return;
                            }

                            const statusDot =
                                buttonElement.querySelector(
                                    '.status-dot'
                                );

                            if (!statusDot) {
                                return;
                            }

                            statusDot.classList.remove(
                                'status-on',
                                'status-off'
                            );

                            if (data.value === true) {
                                statusDot.classList.add(
                                    'status-on'
                                );
                            } else {
                                statusDot.classList.add(
                                    'status-off'
                                );
                            }
                        }
                    );
                }
            );

            Homey.on(
                'buttonBooleanValueChanged',
                data => {

                    const buttonElement =
                        buttonContainer.querySelector(
                            `[data-button-id="${data.buttonId}"]`
                        );

                    if (!buttonElement) {
                        return;
                    }

                    if (
                        buttonElement.dataset.variableSource !==
                        'flow'
                    ) {
                        return;
                    }

                    const statusDot =
                        buttonElement.querySelector(
                            '.status-dot'
                        );

                    if (!statusDot) {
                        return;
                    }

                    statusDot.classList.remove(
                        'status-on',
                        'status-off'
                    );

                    if (data.value === true) {
                        statusDot.classList.add(
                            'status-on'
                        );
                    } else {
                        statusDot.classList.add(
                            'status-off'
                        );
                    }
                }
            );

            try {

                const allButtons = await Homey.api(
                    'GET',
                    '/buttons'
                );

                const settings =
                    Homey.getSettings();

                const selectedButtonIds = [
                    settings.button1?.id,
                    settings.button2?.id,
                    settings.button3?.id,
                    settings.button4?.id,
                    settings.button5?.id,
                    settings.button6?.id,
                    settings.button7?.id,
                    settings.button8?.id,
                    settings.button9?.id,
                    settings.button10?.id,
                    settings.button11?.id,
                    settings.button12?.id
                ].filter(Boolean);

                const buttons =
                    selectedButtonIds
                        .map(buttonId =>
                            allButtons.find(
                                button =>
                                    button.id === buttonId
                            )
                        )
                        .filter(Boolean);


                buttonContainer.innerHTML = '';
                if (buttons.length === 0) {

                    buttonContainer.textContent =
                        Homey.__('widget.add_button');

                    Homey.ready({
                        height: 58
                    });

                    return;
                }

                buttons.forEach(button => {

                    const buttonElement =
                        document.createElement('button');

                    buttonElement.type = 'button';
                    buttonElement.dataset.buttonId =
                        button.id;

                    if (button.type === 'boolean') {

                        const statusDot =
                            document.createElement('span');

                        statusDot.classList.add(
                            'status-dot'
                        );

                        const textElement =
                            document.createElement('span');

                        textElement.classList.add(
                            'button-text'
                        );

                        if (button.textAlign === 'left') {
                            textElement.classList.add(
                                'text-align-left'
                            );
                        }

                        const buttonText =
                            button.text || Homey.__('widget.button_fallback');

                        textElement.textContent = buttonText;

                        buttonElement.appendChild(
                            statusDot
                        );

                        buttonElement.appendChild(
                            textElement
                        );

                    } else {

                        buttonElement.textContent =
                            button.text || Homey.__('widget.button_fallback');
                    }

                    buttonElement.classList.add(
                        'panel-button'
                    );

                    const lightloopSvg =
                        document.createElementNS(
                            'http://www.w3.org/2000/svg',
                            'svg'
                        );


                    lightloopSvg.classList.add(
                        'lightloop-svg'
                    );

                    const permanentPath =
                        document.createElementNS(
                            'http://www.w3.org/2000/svg',
                            'path'
                        );

                    permanentPath.classList.add(
                        'permanent-path'
                    );

                    permanentPath.style.fill = 'none';
                    permanentPath.style.stroke =
                        button.permanentColor || '#00ff66';
                    permanentPath.dataset.enabled =
                        button.permanentColorEnabled === true
                            ? 'true'
                            : 'false';
                    permanentPath.style.strokeWidth = '2';
                    permanentPath.style.display =
                        button.permanentColorEnabled === true
                            ? ''
                            : 'none';

                    lightloopSvg.appendChild(
                        permanentPath
                    );

                    const lightloopPathTop =
                        document.createElementNS(
                            'http://www.w3.org/2000/svg',
                            'path'
                        );

                    const lightloopPathBottom =
                        document.createElementNS(
                            'http://www.w3.org/2000/svg',
                            'path'
                        );

                    [
                        lightloopPathTop,
                        lightloopPathBottom
                    ].forEach(lightloopPath => {

                        lightloopPath.classList.add(
                            'lightloop-path'
                        );

                        lightloopPath.style.display =
                            'none';

                        lightloopSvg.appendChild(
                            lightloopPath
                        );
                    });

                    lightloopPathTop.classList.add(
                        'lightloop-path-top'
                    );

                    lightloopPathBottom.classList.add(
                        'lightloop-path-bottom'
                    );

                    buttonElement.appendChild(
                        lightloopSvg
                    );

                    if (button.width === 'large') {

                        buttonElement.classList.add(
                            'button-large'
                        );

                    } else {

                        buttonElement.classList.add(
                            'button-small'
                        );
                    }
                    if (button.enabled === false) {
                        buttonElement.disabled = true;
                        buttonElement.classList.add('button-disabled');
                    }


                    // Klik op actieknop
                    if (button.type === 'action') {

                        buttonElement.addEventListener(
                            'click',
                            async () => {

                                try {

                                    await Homey.api(
                                        'POST',
                                        '/trigger-action-button',
                                        {
                                            buttonId: button.id
                                        }
                                    );

                                } catch (error) {

                                    console.error(
                                        `Fout bij uitvoeren actieknop "${button.text}":`,
                                        error
                                    );
                                }
                            }
                        );
                    }

                    if (button.type === 'boolean') {

                        buttonElement.dataset.variableSource =
                            button.variableSource || 'homey';

                        if (
                            button.variableSource === 'flow'
                        ) {
                            const statusDot =
                                buttonElement.querySelector(
                                    '.status-dot'
                                );

                            if (statusDot) {
                                statusDot.classList.add(
                                    button.booleanValue === true
                                        ? 'status-on'
                                        : 'status-off'
                                );
                            }
                        }

                        buttonElement.addEventListener(
                            'click',
                            async () => {

                                try {

                                    await Homey.api(
                                        'POST',
                                        '/trigger-boolean-button',
                                        {
                                            buttonId: button.id
                                        }
                                    );

                                } catch (error) {

                                    console.error(
                                        `Fout bij uitvoeren Ja/Nee-knop "${button.text}":`,
                                        error
                                    );
                                }
                            }
                        );
                    }


                    buttonContainer.appendChild(
                        buttonElement
                    );

                    /*
 * Links uitgelijnde Ja/Nee-tekst:
 * alleen indien nodig verdelen over twee regels.
 */
                    if (
                        button.type === 'boolean' &&
                        button.textAlign === 'left'
                    ) {

                        const textElement =
                            buttonElement.querySelector('.button-text');

                        if (textElement) {

                            const textStyle =
                                getComputedStyle(textElement);

                            const canvas =
                                document.createElement('canvas');

                            const context =
                                canvas.getContext('2d');

                            context.font =
                                textStyle.font;

                            const textWidth =
                                context.measureText(
                                    textElement.textContent
                                ).width;

                            const availableWidth =
                                textElement.clientWidth;

                            if (textWidth > availableWidth) {

                                const words =
                                    textElement.textContent
                                        .trim()
                                        .split(/\s+/);

                                if (words.length > 1) {

                                    let bestText = null;
                                    let bestWidth = Infinity;

                                    for (
                                        let i = 1;
                                        i < words.length;
                                        i++
                                    ) {

                                        const firstLine =
                                            words.slice(0, i).join(' ');

                                        const secondLine =
                                            words.slice(i).join(' ');

                                        const firstWidth =
                                            context.measureText(firstLine).width;

                                        const secondWidth =
                                            context.measureText(secondLine).width;

                                        const widestLine =
                                            Math.max(
                                                firstWidth,
                                                secondWidth
                                            );

                                        if (
                                            widestLine < bestWidth &&
                                            widestLine <= availableWidth
                                        ) {

                                            bestWidth =
                                                widestLine;

                                            bestText =
                                                `${firstLine}\n${secondLine}`;
                                        }
                                    }

                                    if (bestText) {

                                        textElement.style.whiteSpace =
                                            'pre';

                                        textElement.textContent =
                                            bestText;
                                    }
                                }
                            }
                        }
                    }

                    if (
                        button.type === 'boolean' &&
                        button.textAlign !== 'left'
                    ) {

                        const statusDot =
                            buttonElement.querySelector('.status-dot');

                        const textElement =
                            buttonElement.querySelector('.button-text');

                        if (statusDot && textElement) {

                            const buttonRect =
                                buttonElement.getBoundingClientRect();

                            const dotRect =
                                statusDot.getBoundingClientRect();

                            const textStyle =
                                getComputedStyle(textElement);

                            const canvas =
                                document.createElement('canvas');

                            const context =
                                canvas.getContext('2d');

                            context.font =
                                textStyle.font;

                            const textWidth =
                                context.measureText(
                                    textElement.textContent
                                ).width;

                            // Positie bij exact centreren
                            const centeredLeft =
                                buttonRect.left +
                                (buttonRect.width - textWidth) / 2;

                            // Tekst mag niet over het bolletje lopen
                            const minimumLeft =
                                dotRect.right + 15;

                            // Eerst bepalen waar de tekst uiteindelijk zou komen
                            const shift =
                                centeredLeft < minimumLeft
                                    ? minimumLeft - centeredLeft
                                    : 0;

                            const finalLeft =
                                centeredLeft + shift;

                            const finalRight =
                                finalLeft + textWidth;

                            // Rechts ook een kleine marge houden
                            const maximumRight =
                                buttonRect.right - 8;

                            if (finalRight <= maximumRight) {

                                // Past netjes op één regel
                                if (shift > 0) {
                                    textElement.style.transform =
                                        `translateX(${shift}px)`;
                                }

                            } else {

                                // Past niet netjes op één regel:
                                // zoek de beste verdeling over twee regels
                                const words =
                                    textElement.textContent
                                        .trim()
                                        .split(/\s+/);

                                if (words.length > 1) {

                                    let bestText = null;
                                    let bestWidth = Infinity;

                                    for (
                                        let i = 1;
                                        i < words.length;
                                        i++
                                    ) {

                                        const firstLine =
                                            words.slice(0, i).join(' ');

                                        const secondLine =
                                            words.slice(i).join(' ');

                                        const firstWidth =
                                            context.measureText(firstLine).width;

                                        const secondWidth =
                                            context.measureText(secondLine).width;

                                        const widestLine =
                                            Math.max(
                                                firstWidth,
                                                secondWidth
                                            );

                                        if (widestLine < bestWidth) {

                                            bestWidth =
                                                widestLine;

                                            bestText =
                                                `${firstLine}\n${secondLine}`;
                                        }
                                    }
                                    if (bestText) {

                                        textElement.style.whiteSpace =
                                            'pre';

                                        textElement.textContent =
                                            bestText;

                                        // De breedste regel bepaalt de breedte
                                        // van het tweeregelige tekstblok.
                                        const twoLineLeft =
                                            buttonRect.left +
                                            (buttonRect.width - bestWidth) / 2;

                                        const twoLineMinimumLeft =
                                            dotRect.right + 15;

                                        let twoLineShift = 0;

                                        // Alleen naar rechts schuiven als de
                                        // breedste regel te dicht bij het bolletje komt.
                                        if (twoLineLeft < twoLineMinimumLeft) {

                                            twoLineShift =
                                                twoLineMinimumLeft - twoLineLeft;
                                        }

                                        // Controleer ook de rechterkant.
                                        const twoLineRight =
                                            twoLineLeft +
                                            twoLineShift +
                                            bestWidth;

                                        const twoLineMaximumRight =
                                            buttonRect.right - 8;

                                        if (twoLineRight > twoLineMaximumRight) {

                                            twoLineShift -=
                                                twoLineRight -
                                                twoLineMaximumRight;
                                        }

                                        if (twoLineShift > 0) {

                                            textElement.style.transform =
                                                `translateX(${twoLineShift}px)`;

                                        } else {

                                            textElement.style.transform = '';
                                        }
                                    }

                                }
                            }
                        }
                    }


                    const buttonWidth =
                        buttonElement.offsetWidth;

                    const buttonHeight =
                        buttonElement.offsetHeight;

                    lightloopSvg.setAttribute(
                        'viewBox',
                        `0 0 ${buttonWidth} ${buttonHeight}`
                    );

                    const inset = 1.5;

                    const left =
                        inset;

                    const right =
                        buttonWidth - inset;

                    const top =
                        inset;

                    const bottom =
                        buttonHeight - inset;

                    const radius =
                        (bottom - top) / 2;

                    const centerY =
                        buttonHeight / 2;

                    const pathData = [
                        `M ${left + radius} ${top}`,
                        `H ${right - radius}`,
                        `A ${radius} ${radius} 0 0 1 ${right} ${centerY}`,
                        `A ${radius} ${radius} 0 0 1 ${right - radius} ${bottom}`,
                        `H ${left + radius}`,
                        `A ${radius} ${radius} 0 0 1 ${left} ${centerY}`,
                        `A ${radius} ${radius} 0 0 1 ${left + radius} ${top}`,
                        'Z'
                    ].join(' ');

                    permanentPath.setAttribute(
                        'd',
                        pathData
                    );

                    [
                        lightloopPathTop,
                        lightloopPathBottom
                    ].forEach(lightloopPath => {

                        lightloopPath.setAttribute(
                            'd',
                            pathData
                        );
                    });

                    if (
                        button.type === 'boolean' &&
                        button.variableId
                    ) {


                        buttonElement.dataset.variableId =
                            button.variableId;

                        Homey.api(
                            'GET',
                            button.variableSource === 'betterlogic'
                                ? `/betterlogic-boolean?variableId=${encodeURIComponent(button.variableId)}`
                                : `/boolean?variableId=${encodeURIComponent(button.variableId)}`
                        )

                            .then(result => {

                                const statusDot =
                                    buttonElement.querySelector(
                                        '.status-dot'
                                    );

                                if (!statusDot) {
                                    return;
                                }

                                if (result.value === true) {

                                    statusDot.classList.add(
                                        'status-on'
                                    );

                                } else {

                                    statusDot.classList.add(
                                        'status-off'
                                    );
                                }
                            })
                            .catch(error => {

                                console.error(
                                    `Fout bij ophalen boolean voor "${button.text}":`,
                                    error
                                );
                            });
                    }
                });

                let rows = 0;
                let halfRowUsed = false;

                buttons.forEach(button => {

                    if (button.width === 'large') {

                        if (halfRowUsed) {
                            rows++;
                            halfRowUsed = false;
                        }

                        rows++;

                    } else {

                        if (halfRowUsed) {
                            rows++;
                            halfRowUsed = false;
                        } else {
                            halfRowUsed = true;
                        }
                    }
                });

                if (halfRowUsed) {
                    rows++;
                }

                Homey.ready({
                    height: rows * 58
                });
            } catch (error) {

                console.error(
                    'Fout bij laden centrale knoppen:',
                    error
                );

                buttonContainer.textContent =
                    Homey.__('widget.error', { message: error.message });

                Homey.ready({
                    height: 58
                });
            }
        }
    </script>


</body>

</html>
